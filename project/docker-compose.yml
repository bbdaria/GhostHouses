services:
  db:
    extends:
      file: ./db-server/docker-compose.yml
      service: db
    networks:
      - db-net
      - admin-net

  backend:
    extends:
      file: ./web-server/docker-compose.yml
      service: backend
    container_name: ghosthouses-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ghosthouses
      POSTGRES_USER: ghostadmin
      POSTGRES_PASSWORD: ghostpass123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
      - db-net

  frontend:
    extends:
      file: ./web-server/docker-compose.yml
      service: frontend
    container_name: ghosthouses-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "443:443"
    volumes:
      - ./certs/dev.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/dev.key:/etc/nginx/certs/server.key:ro
    networks:
      - app-net

  pgadmin:
    extends:
      file: ./db-server/docker-compose.yml
      service: pgadmin
    depends_on:
      db:
        condition: service_started
    networks:
      - admin-net

volumes:
  db-data:
  pgadmin-data:

networks:
  app-net:
  db-net:
  admin-net:
