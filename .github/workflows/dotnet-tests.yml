name: Run Backend Tests

on:
  push:
    paths:
      - 'web-server/backend/**'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore web-server/backend

      - name: Build backend
        run: dotnet build --no-restore web-server/backend

      - name: Run tests
        run: dotnet test --no-build --verbosity normal web-server/backend/WebServer.Tests
