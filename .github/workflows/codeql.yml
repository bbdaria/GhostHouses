name: CodeQL

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - csharp
          - javascript-typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node 20
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: project/web-server/frontend/package-lock.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build C# backend for analysis
        if: matrix.language == 'csharp'
        run: |
          dotnet restore tests/WebServer.Tests/WebServer.Tests.csproj
          dotnet build tests/WebServer.Tests/WebServer.Tests.csproj --configuration Release --no-restore

      - name: Install frontend dependencies for analysis
        if: matrix.language == 'javascript-typescript'
        working-directory: project/web-server/frontend
        run: npm ci

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
