name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend tests
        run: dotnet restore tests/WebServer.Tests/WebServer.Tests.csproj

      - name: Build backend tests
        run: dotnet build tests/WebServer.Tests/WebServer.Tests.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test tests/WebServer.Tests/WebServer.Tests.csproj --configuration Release --no-restore --no-build

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: project/web-server/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: project/web-server/frontend
        run: npm ci

      - name: Build frontend
        working-directory: project/web-server/frontend
        run: npm run build

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create CI environment file
        working-directory: project
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_DB=ghosthouses
          POSTGRES_USER=ghosthouses_ci
          POSTGRES_PASSWORD=ghosthouses-ci-password
          PGADMIN_DEFAULT_EMAIL=ci@example.com
          PGADMIN_DEFAULT_PASSWORD=ghosthouses-ci-pgadmin-password
          JWT_ISSUER=ghosthouses
          JWT_AUDIENCE=ghosthouses-clients
          JWT_SIGNING_KEY=ghosthouses-ci-signing-key-at-least-32-chars
          JWT_EXPIRATION_MINUTES=120
          EOF

      - name: Validate Docker Compose configuration
        working-directory: project
        run: docker compose --env-file .env.ci config

      - name: Build Docker images
        working-directory: project
        run: docker compose --env-file .env.ci build backend frontend
