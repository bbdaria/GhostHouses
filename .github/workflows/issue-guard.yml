name: Issue Guard

on:
  issues:
    types: [opened, edited, milestoned, demilestoned, labeled, unlabeled, reopened]

permissions:
  issues: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce milestone and parent user story
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) {
              return;
            }

            const { owner, repo } = context.repo;
            const issueNumber = issue.number;
            const labelNames = (issue.labels || []).map((label) => label.name);

            if (labelNames.includes('User Story')) {
              return;
            }

            const body = issue.body || '';
            const lines = body.split(/\r?\n/);
            const getSectionValue = (label) => {
              const header = new RegExp(`^###\\s*${label}\\s*$`, 'i');
              for (let i = 0; i < lines.length; i += 1) {
                if (header.test(lines[i].trim())) {
                  for (let j = i + 1; j < lines.length; j += 1) {
                    const value = lines[j].trim();
                    if (!value) continue;
                    if (value.startsWith('###')) break;
                    if (value.toLowerCase() === '_no response_') return '';
                    return value;
                  }
                }
              }
              return '';
            };

            const milestoneValue = getSectionValue('Milestone');
            const parentValue = getSectionValue('Parent User Story');
            const parseIssueNumber = (value) => {
              if (!value) return null;
              const match = value.match(/#?(\\d+)/);
              return match ? Number(match[1]) : null;
            };
            const parentNumber = parseIssueNumber(parentValue);

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            await ensureLabel('needs-milestone', 'ededed', 'Milestone is required');
            await ensureLabel('needs-user-story-parent', 'ededed', 'Parent User Story is required');

            const issueResponse = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            let hasMilestone = Boolean(issueResponse.data.milestone);

            if (!hasMilestone && milestoneValue) {
              const milestones = await github.paginate(github.rest.issues.listMilestones, {
                owner,
                repo,
                state: 'open'
              });
              const match = milestones.find((m) =>
                m.title.toLowerCase() === milestoneValue.trim().toLowerCase()
              );
              if (match) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  milestone: match.number
                });
                hasMilestone = true;
              }
            }

            if (!hasMilestone) {
              if (!labelNames.includes('needs-milestone')) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ['needs-milestone']
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: 'Milestone is required. Please set a milestone for this issue.'
                });
              }
            } else if (labelNames.includes('needs-milestone')) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issueNumber,
                name: 'needs-milestone'
              });
            }

            const query = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                    labels(first: 20) {
                      nodes { name }
                    }
                    parent {
                      ... on Issue {
                        id
                        number
                        labels(first: 20) {
                          nodes { name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const data = await github.graphql(query, { owner, repo, number: issueNumber });
            const issueData = data.repository.issue;
            const currentParent = issueData.parent;
            const isUserStory = (labels) =>
              (labels || []).some((label) => label.name === 'User Story');

            const addParent = async (parentId) => {
              const mutation = `
                mutation($issueId: ID!, $subIssueId: ID!) {
                  addSubIssue(input: { issueId: $issueId, subIssueId: $subIssueId }) {
                    issue { id }
                  }
                }
              `;
              await github.graphql(mutation, { issueId: parentId, subIssueId: issueData.id });
            };

            let parentValid = false;
            if (currentParent) {
              parentValid = isUserStory(currentParent.labels?.nodes || []);
            } else if (parentNumber) {
              const parentData = await github.graphql(query, { owner, repo, number: parentNumber });
              const parentIssue = parentData.repository.issue;
              if (parentIssue && isUserStory(parentIssue.labels?.nodes || [])) {
                await addParent(parentIssue.id);
                parentValid = true;
              }
            }

            if (!parentValid) {
              if (!labelNames.includes('needs-user-story-parent')) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ['needs-user-story-parent']
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: 'Parent User Story is required and must be labeled \"User Story\".'
                });
              }
            } else if (labelNames.includes('needs-user-story-parent')) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issueNumber,
                name: 'needs-user-story-parent'
              });
            }
